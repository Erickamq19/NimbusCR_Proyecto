    <!-- BARRA DE NAVEGACIÓN -->

                    SOLUCIONES LOGÍSTICAS
                </small>
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">

                        </a>
                    </li>

                    <li class="nav-item">

<main>

    <section class="seccion-rastreo">

        <div class="container text-center">

            <h1 class="titulo-rastreo">
                RASTREA TU ENVÍO INGRESANDO EL NÚMERO DE GUÍA:
            </h1>

            <form id="formRastreo" class="formulario-rastreo">

                <div class="campo-rastreo">

                    <input type="text"
                           id="numeroGuia"
                           class="form-control"
                           placeholder="Ej: PY12345678CR"
                           maxlength="12"
                           aria-label="Número de guía"
                           required>

                    <span class="icono-rastreo">
                        <i class="bi bi-search"></i>
                    </span>

                    <button type="submit" class="btn-rastrear">
                        Rastrear envío
                    </button>

                </div>
                <small class="formato-guia">
                Formato de guía: PY seguido de 8 números y CR.
            </small>

            </form>


            <div
            id="resultadoRastreo"
            class="resultado-rastreo"
            aria-live="polite"
            hidden>
        </div>

        </div>

    </section>

</main>


     <!-- PIE DE PÁGINA -->
